name: Release plugin

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and upload
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  smoke:
    uses: ./.github/workflows/plugin-smoke.yml
    with:
      ref: ${{ inputs.tag }}
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag }}
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: |
            25
            21
            17
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic
      - name: Check out pinned UI Builder source
        run: ./scripts/checkout-ui-builder.sh
      - name: Validate release version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python3 - <<'PYTHON'
          import json, os, pathlib, re
          tag = os.environ["RELEASE_TAG"]
          assert re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+", tag), tag
          version = tag[1:]
          assert json.loads(pathlib.Path(".release-please-manifest.json").read_text())["."] == version
          assert pathlib.Path("version.txt").read_text().strip() == version
          with open(os.environ["GITHUB_ENV"], "a") as output:
              output.write(f"PLUGIN_VERSION={version}\n")
          PYTHON
      - run: ./gradlew --no-daemon check ktfmtCheck buildPlugin
      - run: python3 scripts/check-distribution.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-plugin
          path: build/distributions/*.zip
          if-no-files-found: error
  upload:
    needs: [build, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-plugin
          path: dist
      - name: Attach verified plugin
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: gh release upload "$RELEASE_TAG" dist/*.zip --clobber
