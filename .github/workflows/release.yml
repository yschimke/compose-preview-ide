name: Release plugin

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
      marketplace:
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and upload
        type: string
        required: true
      marketplace:
        description: Also publish to JetBrains Marketplace (disable when retrying an already published version)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  smoke:
    uses: ./.github/workflows/plugin-smoke.yml
    with:
      ref: ${{ inputs.tag }}
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag }}
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: |
            25
            21
            17
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
      - name: Check out pinned UI Builder source
        run: ./scripts/checkout-ui-builder.sh
      - name: Validate release version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python3 - <<'PYTHON'
          import json, os, pathlib, re
          tag = os.environ["RELEASE_TAG"]
          assert re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+", tag), tag
          version = tag[1:]
          assert json.loads(pathlib.Path(".release-please-manifest.json").read_text())["."] == version
          assert pathlib.Path("version.txt").read_text().strip() == version
          with open(os.environ["GITHUB_ENV"], "a") as output:
              output.write(f"PLUGIN_VERSION={version}\n")
          PYTHON
      - run: ./gradlew --no-daemon check ktfmtCheck buildPlugin
      - run: python3 scripts/check-distribution.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-plugin
          path: build/distributions/*.zip
          if-no-files-found: error
  upload:
    needs: [build, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-plugin
          path: dist
      - name: Attach verified plugin
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: gh release upload "$RELEASE_TAG" dist/*.zip --clobber
  marketplace:
    needs: [build, smoke]
    if: inputs.marketplace
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Scope the token to an environment so it can require approval and stays out of PR jobs.
    environment: jetbrains-marketplace
    steps:
      - name: Check for Marketplace token
        id: token
        env:
          JETBRAINS_MARKETPLACE_TOKEN: ${{ secrets.JETBRAINS_MARKETPLACE_TOKEN }}
        run: |
          if [ -n "$JETBRAINS_MARKETPLACE_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::JETBRAINS_MARKETPLACE_TOKEN is not set; skipping Marketplace publishing."
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.token.outputs.present
        with:
          persist-credentials: false
          ref: ${{ inputs.tag }}
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        if: steps.token.outputs.present
        with:
          distribution: temurin
          java-version: |
            25
            21
            17
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        if: steps.token.outputs.present
        with:
          cache-provider: basic
      # Configuring the build resolves the composite build and version catalog from the pin.
      - name: Check out pinned UI Builder source
        if: steps.token.outputs.present
        run: ./scripts/checkout-ui-builder.sh
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.token.outputs.present
        with:
          name: release-plugin
          path: dist
      - name: Publish verified plugin
        if: steps.token.outputs.present
        env:
          JETBRAINS_MARKETPLACE_TOKEN: ${{ secrets.JETBRAINS_MARKETPLACE_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          archives=(dist/*.zip)
          test "${#archives[@]}" -eq 1
          test "${archives[0]}" = "dist/compose-ui-builder-intellij-plugin-${RELEASE_TAG#v}.zip"
          ./gradlew --no-daemon publishPlugin -PmarketplaceArchive="$PWD/${archives[0]}"
